      Decap CMS 3.17.3, the only script this site loads from another origin
      (AGENTS.md). The integrity hash pins the exact npm-published file, so a

      npm run cms:generate writes from the slide registry. Only this page
      loads it; the viewer never does.
    -->
    <script
      src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"
      integrity="sha384-RWRzuHfiZSWCt3nEvG7B0v3cMgM1C2UuJmgBSL92GQh4uXmNSkbcthql/mNBqvjr"
      crossorigin="anonymous"
    ></script>
