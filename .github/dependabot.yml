version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait 14 days after a release before proposing it.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8 supports TypeScript below 6.1 only. Remove this
      # when a typescript-eslint release supports the next major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: [minor, patch]
