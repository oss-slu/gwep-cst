name: CodeQL

# Disabled for now: the repository uses GitHub's CodeQL default setup, which
# rejects results uploaded by this workflow. To switch back, turn off default
# setup in the repository's code security settings, then restore these
# triggers:
#   pull_request:
#   push:
#     branches: [main]
#   schedule:
#     - cron: "17 6 * * 1"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
